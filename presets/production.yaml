# Production preset - balanced settings for production use
evolution:
  generations: 100
  num_islands: 6
  population_size: 8
  top_k: 3

sandbox:
  timeout_sec: 30.0
  memory_mb: 1024

migration:
  interval: 20
  migrants_per_island: 2

mutation:
  rate: 0.1
  crossover_rate: 0.7

checkpoint:
  enabled: true
  interval: 10
  directory: checkpoints

early_stop:
  enabled: true
  patience: 15
  delta: 0.001

archive:
  enabled: true
  max_size: 100
