# NumPy preset - optimized for NumPy/numerical workloads
evolution:
  generations: 80
  num_islands: 4
  population_size: 8
  top_k: 3

sandbox:
  timeout_sec: 60.0
  memory_mb: 2048

migration:
  interval: 15
  migrants_per_island: 2

mutation:
  rate: 0.1
  crossover_rate: 0.7

checkpoint:
  enabled: true
  interval: 10
  directory: checkpoints

uast:
  enable_numpy_optimizer: true
  numpy_vectorize: true

prompt_evolution:
  enabled: false
