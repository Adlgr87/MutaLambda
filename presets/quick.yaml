# Quick preset - fast feedback for iteration
evolution:
  generations: 20
  num_islands: 2
  population_size: 4
  top_k: 2

sandbox:
  timeout_sec: 15.0
  memory_mb: 512

migration:
  interval: 10
  migrants_per_island: 1

mutation:
  rate: 0.15
  crossover_rate: 0.7

checkpoint:
  enabled: true
  interval: 5
  directory: checkpoints

early_stop:
  enabled: true
  patience: 10
  delta: 0.001

uast:
  enable_svl: false

prompt_evolution:
  enabled: false
