name: "MutaLambda PR Comment"
description: "Run a fast subset of MutaLambda benchmarks and emit an optimization table Markdown comment."

inputs:
  targets:
    description: "Comma-separated target module names to benchmark."
    required: false
    default: "t1_matrix_multiply,t1_primes_sieve,t3_page_rank"
  reps:
    description: "Repetitions per target (keep small for CI feedback < 60s)."
    required: false
    default: "5"

outputs:
  comment-file:
    description: "Path to the generated Markdown comment file (mutalambda-comment.md)."
    value: ${{ steps.run.outputs.comment-file }}

runs:
  using: "composite"
  steps:
    - name: Run MutaLambda benchmark harness (fast subset)
      id: run
      shell: bash
      env:
        PYTHONPATH: .
        TARGETS: ${{ inputs.targets }}
      run: |
        python benchmarks/harness.py \
          --targets "$TARGETS" \
          --skip-llm --skip-compilers --real-muta 0 \
          --reps "${{ inputs.reps }}" \
          > mutalambda-bench.log 2>&1
        # Generate the optimization-table markdown from the result artifacts.
        python - "$TARGETS" <<'PY'
        import json, os, sys
        from pathlib import Path
        targets = [t for t in sys.argv[1].split(",") if t]
        rows = []
        for t in targets:
            raw = Path("benchmarks/results") / t / "raw.json"
            if not raw.exists():
                # Fallback: synthesize a row from summary if per-target file absent.
                rows.append({"target": t, "speedup": "—", "baseline_us": "—",
                             "mutant_us": "—", "correct": "—", "sig": "—"})
                continue
            data = json.loads(raw.read_text())
            base = data.get("baseline", {})
            opt = data.get("optimized", {})
            speedup = data.get("speedup")
            corr = data.get("correctness", {})
            sig = data.get("statistics", {}).get("significant", False)
            rows.append({
                "target": t,
                "speedup": f"{speedup:.2f}" if isinstance(speedup,(int,float)) else "—",
                "baseline_us": f"{base.get('median_s',0)*1e6:.3f}" if base.get("median_s") else "—",
                "mutant_us": f"{opt.get('median_s',0)*1e6:.3f}" if opt.get("median_s") else "—",
                "correct": "✅" if corr.get("verified") else "❌",
                "sig": "✅" if sig else "—",
            })
        lines = ["<!-- mutalambda-pr-bot -->",
                 "",
                 "**MutaLambda benchmark (fast subset)**",
                 "",
                 "| target | speedup | baseline (µs) | mutant (µs) | correct | significant |",
                 "|---|---|---|---|---|---|"]
        for r in rows:
            lines.append(f"| {r['target']} | {r['speedup']} | {r['baseline_us']} | {r['mutant_us']} | {r['correct']} | {r['sig']} |")
        lines += ["", "> Generated by `.github/actions/mutalambda-comment`. Re-runs update this comment (idempotent)."]
        Path("mutalambda-comment.md").write_text("\n".join(lines)+"\n")
        PY
        echo "comment-file=mutalambda-comment.md" >> "$GITHUB_OUTPUT"
