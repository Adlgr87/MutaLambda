# Install dependencies, lint, unit tests, CLI smoke, and fast E2E.

name: Python package

on:
  push:
    branches: [ "main", "maintenance/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 ruff pytest click rich pytest-rerunfailures
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e ".[cli,uast]"
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Lint with ruff (includes the BLE001 gate)
      run: ruff check . --select BLE001
    - name: BLE001 ratchet guard
      # The per-file-ignores inventory may only shrink. Without this, a new
      # entry could be appended and the gate above would still pass.
      run: python scripts/check_ble_ratchet.py
    - name: Unit tests (pytest)
      run: |
        pytest tests/ -v --ignore=tests/e2e_tests.py
    - name: CLI smoke
      run: |
        python mutalambda_cli.py --help
        python mutalambda_cli.py config create --output /tmp/ml-test.yaml --template basic
        python mutalambda_cli.py config validate --path /tmp/ml-test.yaml
        python mutalambda_cli.py doctor || true
    - name: Fast E2E (serial)
      env:
        MUTALAMBDA_E2E_SERIAL: "1"
      # Exit codes are meaningful and must not be swallowed:
      #   0 = good beat bad with margin
      #   1 = real quality regression
      #   2 = indeterminate (a pipeline scored exactly -1.0, i.e. it never ran)
      # The previous `|| python tests/e2e_tests.py --fast` retried on failure
      # and then let the second result stand, which would hide both 1 and 2.
      run: python tests/e2e_tests.py --fast --serial
