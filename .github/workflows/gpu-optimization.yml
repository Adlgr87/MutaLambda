name: GPU Optimization Pipeline

on:
  push:
    branches: [main, gpu-experiment]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Monday 6 AM UTC

jobs:
  gpu-benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        gpu: [true, false]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ matrix.gpu }}" = "true" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Run E2E tests
        run: pytest tests/e2e/ -v --tb=short

      - name: GPU Benchmark (if GPU available)
        if: matrix.gpu == true
        run: |
          python bench_phase6.py --num-generations 10 --population-size 20
          python scripts/generate_status_report.py --output reports/benchmark_gpu.json

      - name: CPU Benchmark
        if: matrix.gpu == false
        run: |
          python bench_phase6.py --num-generations 10 --population-size 20 --cpu-only
          python scripts/generate_status_report.py --output reports/benchmark_cpu.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-py${{ matrix.python-version }}-gpu${{ matrix.gpu }}
          path: |
            reports/
            logs/

  gpu-integration-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'gpu')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GPU dependencies
        run: |
          pip install -e ".[dev,gpu]"

      - name: Test GPU optimizer
        run: |
          python -c "from gpu_optimizer import GPUOptimizer; opt = GPUOptimizer(); print(opt.detect())"
          python tests/test_gpu_optimizer.py

      - name: Test Ray scheduler
        run: |
          python -c "from ray_scheduler import RayScheduler; print('Ray scheduler OK')"
          python tests/test_ray_scheduler.py

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ --cov=muta_lambda --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
