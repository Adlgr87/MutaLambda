# Guards the benchmark harness itself: the measurement must stay unbiased and
# the anti-cheat gates must keep biting. It does NOT publish performance
# numbers — a shared GitHub runner is far too noisy for that, and pretending
# otherwise is the exact failure mode this harness was built to prevent.

name: Benchmark harness

on:
  push:
    branches: [ "main", "maintenance/**", "arena/**" ]
    paths:
      - 'bench/**'
      - 'tests/bench/**'
      - 'scripts/fetch_bench_datasets.py'
      - '.github/workflows/benchmark-harness.yml'
  pull_request:
    paths:
      - 'bench/**'
      - 'tests/bench/**'

jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (harness core is stdlib-only; numpy for the vectorised path)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy

      - name: Harness unit tests (measurement bias + integrity gates)
        run: pytest tests/bench -q

      - name: Suites and datasets are self-describing
        run: |
          python -m bench.runner list
          python -m bench.runner datasets

      - name: Self-test — identity optimizer must not manufacture a speedup
        run: |
          python -m bench.runner run \
            --suite smoke --optimizer baseline --repeats 3 --limit 6 \
            --fail-under-correctness 1.0 --fail-on-rejected \
            --out bench_results/

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke-${{ matrix.python-version }}
          path: bench_results/
          retention-days: 14
