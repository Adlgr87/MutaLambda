version: v1.0
project: MutaLambda
audit_dir: /home/adlg/auditoria_mutalambda/
repo: Adlgr87/MutaLambda
base_commit: 8b471e5

team:
  coordinator: ClaudeCode
  subagents:
    - name: OpenCode
      role: security_ast_analysis
      responsibilities:
        - SecurityVisitor RCE detection
        - test_sandbox_escapes.py
        - MicroVMRunner fail-closed
    - name: OpenHands
      role: secret_redaction
      responsibilities:
        - llm_backend.py _SECRET_PATTERNS
        - sk- pattern coverage
    - name: ClaudeCode
      role: prompt_injection_lazy_init
      responsibilities:
        - models.py PromptGenome.render
        - muta_lambda/agent.py lazy backend
    - name: Prime Agent
      role: fail_closed_isolation
      responsibilities:
        - tiered_evaluator.py fail-closed
        - massive_adapter.py fail-closed

workflow:
  phase_1:
    name: Discovery
    steps:
      - clone_repo: true
      - baseline_tests: python -m pytest tests/ -q --tb=no
      - identify_audit_dir: /home/adlg/auditoria_mutalambda/
  phase_2:
    name: Hallazgo
    steps:
      - run_ast_scan: runners.scan_code_security
      - categorize_findings: [critical, high, medium, low]
      - assign_ids: D1, D2, ..., D15
  phase_3:
    name: Asignacion
    steps:
      - delegate_findings: true
      - each_subagent_gets: [objective, paths, tests, constraints]
  phase_4:
    name: Remediation
    steps:
      - surgical_fix: one_file_per_issue
      - verify_fix: targeted_tests
      - report: pass_fail_with_evidence
  phase_5:
    name: Regression Check
    steps:
      - full_test_suite: python -m pytest tests/ -q
      - git_stash_compare: true
      - zero_regressions: required
      - security_tests: 51/51 pass required
  phase_6:
    name: Entregables
    steps:
      - generate: REPORTE_AUDITORIA_MUTALAMBDA.md
      - generate: WORKFLOW_AGENT_TEAM.md
      - generate: agent_team_workflow.yaml
      - location: /home/adlg/auditoria_mutalambda/
  phase_7:
    name: Pull Request
    steps:
      - create_branch: maintenance/security-oleada-1
      - commit_message: fix(security): Oleada 1 remediations + audit deliverables
      - push_to: Adlgr87/MutaLambda
      - create_pr: true
      - merge_to: main
      - verify_ci: github actions green

priority:
  1: Security Priority #1 (RCE first)
  2: Zero Regressions (git stash)
  3: Surgical Changes (1 file per fix)
  4: Test Coverage (pass existing tests)

tools:
  OpenCode: AST analysis, SecurityVisitor, tests
  OpenHands: Secret redaction, regex
  ClaudeCode: Prompt injection, lazy init, orchestration
  Prime Agent: Fail-closed, isolation, sandbox