[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutalambda"
version = "5.0.0"
description = "Evolutionary multi-island code optimization framework"
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
authors = [{ name = "Adlgr87" }]
dependencies = [
  # ML-007: bounded ranges (upper pins) so upstream minor/major bumps cannot
  # silently change results or introduce CVEs. Exact versions stay locked in
  # uv.lock and are validated by `uv sync --locked` in CI.
  "numpy>=2.0,<3",
  "msgpack>=1.1,<2",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
core = [
  "numpy>=2.0,<3",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0,<7",
  "requests>=2.31,<3",
]
uast = [
  "tree-sitter>=0.21,<0.27",
  "tree-sitter-go>=0.23.4,<0.26",
  "tree-sitter-rust>=0.21,<0.25",
  "tree-sitter-cpp>=0.22,<0.25",
]
archive = [
  "faiss-cpu>=1.13,<2",
  "sentence-transformers>=5,<6",
]
headroom = [
  "headroom-ai>=0.37,<1",
]
cli = [
  "click>=8,<9",
  "rich>=13,<16",
]
dashboard = [
  "streamlit>=1.50,<2",
  # dashboard.py builds every chart through pandas.DataFrame; without it the
  # Fitness/Diversity/Islands/Pareto tabs raise ModuleNotFoundError at render.
  "pandas>=2,<3",
]
scientific = [
  "z3-solver>=4.12,<6",
  "pdfplumber>=0.11,<0.12",
  "pandas>=2,<3",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
]
dev = [
  "pytest>=7,<10",
  # Required by the coverage CI job (`pytest tests/ --cov=...`); without it
  # pytest exits with "unrecognized arguments: --cov=...".
  "pytest-cov>=6,<8",
  # The suite uses ``@pytest.mark.flaky(reruns=...)`` for the timing-sensitive
  # deep-evolution tests; without this plugin the marker is a no-op and those
  # tests fail under load.
  "pytest-rerunfailures>=14,<17",
  "hypothesis>=6,<7",
  "ruff>=0.6,<1",
  "mypy>=1,<2",
]
all = [
  "mutalambda[core,archive,cli,dashboard,scientific,dev]",
]

[project.scripts]
mutalambda = "mutalambda_cli:cli"

[tool.setuptools]
# Root-level modules (flat layout). The 4 `mutalambda_*` packages below hold
# the implementation; several root modules are thin backward-compatibility
# shims that re-export from them (see their docstrings).
py-modules = [
  # CLI / entrypoints
  "mutalambda_cli",
  "evolve",
  "benchmark_runner",
  "benchmarking",
  # Core evolution (implementation lives in mutalambda_core / mutalambda_engines)
  "sandbox",
  "fitness_vector",
  "island_evolution",
  "migration",
  "llm_backend",
  "evolution_engine",
  "mutation_filters",
  "progressive_pipeline",
  "component_evolution",
  "nsga2",
  "hfc_tiers",
  "gpu_optimizer",
  "ray_scheduler",
  "evaluation_service",
  "runners",
  "api_fingerprint",
  "differential",
  "event_bus",
  "massive_adapter",
  "operator_bandit",
  "cost_ledger",
  "fitness_cache",
  "optimization_flags",
  "trace_compressor",
  "ast_stubs",
  "structured_ops",
  "headroom_integration",
  "extensions",
  "fitness_normalize",
  "rng_session",
  "run_artifacts",
  "muta_config",
  "code_hash",
  "comparison",
  "logging_setup",
  "constants",
  # Verification / analysis
  "ast_math_verifier",
  "hotspot_profiler",
  "numpy_optimizer",
  "test_synthesizer",
  "diagnostics",
  "interpretability",
  "invariant_detector",
  "universal_parser",
  "regression_gate",
  "certify",
  "property_testing",
  "secure_exec",
  "workflow_protocol",
  # Telemetry / reporting
  "metrics_exporter",
  "performance_monitor",
  "telemetry",
  # Cost layer
  "economic_gate",
  "pareto_archive",
  # Prompt evolution
  "prompt_evolution",
  "prompt_evolver",
  # Dashboard
  "dashboard",
  "dashboard_run",
  # Checkpointing / config
  "checkpoint_manager",
  "config_loader",
  # Backward-compatibility shims (moved into the mutalambda_* packages)
  "archive",
]
packages = [
  "cli",
  "lsp",
  "muta_lambda",
  "mutalambda_config",
  "mutalambda_core",
  "mutalambda_engines",
  "mutalambda_security",
  "muta_ext",
  "muta_ext.config",
  "muta_ext.diagnostics",
  "muta_ext.evaluation",
  "muta_ext.lineage",
  "muta_ext.mutation",
  "muta_ext.scientific",
  "muta_ext.uast",
  "muta_ext.uast.adapters",
  "muta_ext.uast.emitters",
  "muta_ext.uast.handlers",
  "muta_ext.uast.mutators",
  "muta_ext.uast.mutators.generated",
  "muta_ext.uast.mutators.scientific",
  "muta_ext.uast.validators",
  "muta_ext.uast2",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "root: tests básicos del core",
    "scientific: tests de extensión científica",
    "uast: tests UAST",
    "benchmarks: tests de benchmark",
    "e2e: tests end-to-end",
    "v4: tests de nuevas funcionalidades v4.0",
    "go: tests de soporte Go",
    "ci: tests de integración CI/CD",
    "flaky: inestable - requiere re-ejecución bajo ambiente estable",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE001 (blind `except Exception`) is enforced as a RATCHET, not a warning:
# it is an error everywhere except the files listed in per-file-ignores below,
# which is the frozen inventory of pre-existing cases at the time the rule was
# turned on. Consequences:
#   * any NEW file, and any file already cleaned, fails CI on a blind except;
#   * triaging a module means removing its line from the list, which can only
#     ever shrink.
# A blind except that is genuinely correct (teardown paths, telemetry) stays,
# but must carry an inline `# noqa: BLE001 - <reason>` so the intent is
# explicit and reviewable.
#
# Triage tiers (see docs/AUDIT_V5_SCRUTINY.md):
#   1. evaluation pool / forkserver .... DONE
#   2. correctness gate: mutation_filters, sandbox, property_testing,
#      ast_math_verifier, comparison, checkpoint_manager
#   3. llm_backend: separate network/timeout from parse errors
#   4. CLI/UI top level: keep, but must log a traceback
select = ["E4", "E7", "E9", "F", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# ── BLE001 debt inventory — remove lines as modules are triaged, never add ──
    "bench_headroom_fase3.py" = ["BLE001"]
