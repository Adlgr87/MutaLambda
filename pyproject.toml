[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutalambda"
version = "5.0.0"
description = "Evolutionary multi-island code optimization framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adlgr87" }]
dependencies = [
  # ML-007: bounded ranges (upper pins) so upstream minor/major bumps cannot
  # silently change results or introduce CVEs. Exact versions stay locked in
  # uv.lock and are validated by `uv sync --locked` in CI.
  "numpy>=2.0,<3",
  "msgpack>=1.1,<2",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
core = [
  "numpy>=2.0,<3",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0,<7",
  "requests>=2.31,<3",
]
uast = [
  "tree-sitter>=0.21,<0.27",
  "tree-sitter-go>=0.23.4,<0.26",
  "tree-sitter-rust>=0.21,<0.25",
  "tree-sitter-cpp>=0.22,<0.25",
]
archive = [
  "faiss-cpu>=1.13,<2",
  "sentence-transformers>=5,<6",
]
cli = [
  "click>=8,<9",
  "rich>=13,<16",
]
dashboard = [
  "streamlit>=1.50,<2",
]
scientific = [
  "z3-solver>=4.12,<6",
  "pdfplumber>=0.11,<0.12",
  "pandas>=2,<3",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
]
dev = [
  "pytest>=7,<10",
  # The suite uses ``@pytest.mark.flaky(reruns=...)`` for the timing-sensitive
  # deep-evolution tests; without this plugin the marker is a no-op and those
  # tests fail under load.
  "pytest-rerunfailures>=14,<17",
  "hypothesis>=6,<7",
  "ruff>=0.6,<1",
  "mypy>=1,<2",
]
all = [
  "mutalambda[core,archive,cli,dashboard,scientific,dev]",
]

[project.scripts]
mutalambda = "mutalambda_cli:cli"

[tool.setuptools]
py-modules = [
  "mutalambda_cli",
  "sandbox",
  "models",
  "fitness_vector",
  "island",
  "island_evolution",
  "migration",

  "llm_backend",
  "evolution_engine",
  "mutation_filters",
  "progressive_pipeline",
  "component_evolution",
  "ast_math_verifier",
  "hotspot_profiler",
  "numpy_optimizer",
  "test_synthesizer",
  "diagnostics",
  "dashboard_run",
  "nsga2",
  "checkpoint_manager",
  "config_loader",
  "workflow_protocol",
  "prompt_evolution",
  "prompt_evolver",
  "property_testing",
  "hfc_tiers",
  "interpretability",
  "dashboard",

  "gpu_optimizer",
  "evaluation_service",
  "runners",
  "benchmarking",
  "api_fingerprint",
  "differential",
  "event_bus",
  "massive_adapter",
  "operator_bandit",
  "cost_ledger",
  "fitness_cache",
  "optimization_flags",
  "extensions",
  "fitness_normalize",
  "rng_session",
  "run_artifacts",
  "muta_config",
  "code_hash",
  "comparison",
  "logging_setup",
  "constants",
]
packages = [
  "cli",
  "lsp",
  "muta_lambda",
  "muta_ext",
  "muta_ext.config",
  "muta_ext.diagnostics",
  "muta_ext.evaluation",
  "muta_ext.lineage",
  "muta_ext.mutation",
  "muta_ext.scientific",
  "muta_ext.uast",
  "muta_ext.uast.adapters",
  "muta_ext.uast.emitter",
  "muta_ext.uast.emitters",
  "muta_ext.uast.handlers",
  "muta_ext.uast.mutators",
  "muta_ext.uast.mutators.generated",
  "muta_ext.uast.mutators.scientific",
  "muta_ext.uast.validators",
  "muta_ext.uast2",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "root: tests básicos del core",
    "scientific: tests de extensión científica",
    "uast: tests UAST",
    "benchmarks: tests de benchmark",
    "e2e: tests end-to-end",
    "v4: tests de nuevas funcionalidades v4.0",
    "go: tests de soporte Go",
    "ci: tests de integración CI/CD",
    "flaky: inestable - requiere re-ejecución bajo ambiente estable",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.coverage.run]
source = ["muta_lambda", "cli", "muta_ext"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
]
