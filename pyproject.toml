[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutalambda"
version = "4.0.0"
description = "Evolutionary multi-island code optimization framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BUSL-1.1" }
authors = [{ name = "Adlgr87" }]
dependencies = [
  "numpy",
  "msgpack",
  "pydantic>=2",
  "pyyaml",
  "requests",
]

[project.optional-dependencies]
core = [
  "numpy",
  "msgpack",
  "pydantic>=2",
  "pyyaml",
  "requests",
]
uast = [
  "tree-sitter>=0.21",
  "tree-sitter-go>=0.23.4",
  "tree-sitter-rust>=0.21",
  "tree-sitter-cpp>=0.22",
]
archive = [
  "faiss-cpu",
  "sentence-transformers",
]
cli = [
  "click",
  "rich",
]
dashboard = [
  "streamlit",
]
scientific = [
  "z3-solver",
  "pdfplumber",
  "pandas",
  "openpyxl",
  "Pillow",
]
dev = [
  "pytest>=7",
  "hypothesis",
  "ruff",
  "mypy",
]
all = [
  "mutalambda[core,archive,cli,dashboard,scientific,dev]",
]

[project.scripts]
mutalambda = "mutalambda.cli_app:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "root: tests básicos del core",
    "scientific: tests de extensión científica",
    "uast: tests UAST",
    "benchmarks: tests de benchmark",
    "e2e: tests end-to-end",
    "v4: tests de nuevas funcionalidades v4.0",
    "go: tests de soporte Go",
    "ci: tests de integración CI/CD",
]

[tool.ruff]
line-length = 100
target-version = "py39"
