evolution:
  generations: 100
  num_islands: 6
  population_size: 12
  top_k: 4
migration:
  interval: 8
  migrants_per_island: 2
  topology: ring
mutation:
  rate: 0.12
  crossover_rate: 0.75
  strategies:
  - random
  - guided
  - crossover
fitness:
  weights:
    correctness: 0.6
    performance: 0.3
    complexity: 0.1
sandbox:
  timeout_sec: 30.0
checkpoint:
  enabled: true
  interval: 5
  directory: checkpoints
  compress: true
early_stop:
  enabled: true
  patience: 20
  delta: 0.001
logging:
  level: INFO
  file: mutalambda.log
hfc:
  enabled: true
  tier1_size: 50
  tier2_size: 100
  tier3_size: 50
